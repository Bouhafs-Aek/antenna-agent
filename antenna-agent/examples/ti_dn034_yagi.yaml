# TI DN034 / SWRA350 - 2.4 GHz Yagi PCB antenna. Every dims_mm value is read from the paper (Fig 2, Fig 6, text).
name: ti_dn034_yagi
family: printed_yagi
f0_ghz: 2.44
z0_ohm: 50
sweep_ghz: [2.0, 2.7]          # paper's S11 plot span (Fig 7)
