  L3: 34.29      # directors
  L4: 34.29
  L5: 34.29
  W3: 3.81
  W4: 3.81
  W5: 3.81
  S12: 16.00     # pour edge -> driven element (= two-wire feed length)
  S23: 15.49
  S34: 15.49
  S45: 15.49
  S56: 36.20     # printed without unit in the paper
  Bw: 100        # board 100 x 150 mm
  Bl: 150
  Ws: 0.4064     # two-wire strip width (Fig 6)
  h32: 0.226     # antenna-top to antenna-bottom dielectric
  h21: 0.99
  h10: 0.226
  tcu: 0.0343
reported: {bw_mhz: 497, gain_dbi: 7.22}   # measured OTA gain @2.4 GHz; BW 2126-2623 MHz
source_pages: [1, 3, 4, 5, 8]
