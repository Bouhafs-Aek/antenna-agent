[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "antenna-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pydantic>=2", "pyyaml", "pymupdf", "anthropic", "matplotlib"]

[project.scripts]
antenna-agent = "antenna_agent.cli:main"

[tool.setuptools]
packages = ["antenna_agent"]
